<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<meta name="theme-color" content="#5b5bf0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<main class="app">
  <header class="app-head">
    <div class="app-icon">₹</div>
    <div>
      <h1>Expense Tracker</h1>
      <p class="sub">Add your daily spending and see where your money goes.</p>
    </div>
  </header>

  <section class="summary">
    <div class="total"><span>Total spent</span><strong id="total">₹0</strong></div>
    <div class="total alt"><span>Entries</span><strong id="count">0</strong></div>
  </section>

  <form id="form" class="card">
    <h2>Add an expense</h2>
    <div class="field">
      <label for="title">What did you buy?</label>
      <input id="title" type="text" placeholder="e.g. Groceries" required maxlength="40">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="amount">Amount (₹)</label>
        <input id="amount" type="number" placeholder="0" min="1" step="any" required>
      </div>
      <div class="field">
        <label for="category">Category</label>
        <div class="select-wrap">
          <select id="category">
            <option>Food</option><option>Travel</option><option>Shopping</option>
            <option>Bills</option><option>Other</option>
          </select>
        </div>
      </div>
    </div>
    <div class="field">
      <label for="date">Date</label>
      <input id="date" type="date" required>
    </div>
    <button type="submit">Add expense</button>
  </form>

  <section class="card">
    <h2>By category</h2>
    <div id="bars"></div>
  </section>

  <section class="card">
    <div class="row">
      <h2>Expenses</h2>
      <div class="select-wrap small">
        <select id="filter" aria-label="Filter by category">
          <option value="All">All</option><option>Food</option><option>Travel</option>
          <option>Shopping</option><option>Bills</option><option>Other</option>
        </select>
      </div>
    </div>
    <ul id="list"></ul>
    <p id="empty" class="empty">No expenses yet. Add your first one above.</p>
  </section>

  <footer class="app-foot">Built by Archana Giri</footer>
</main>
<script src="script.js"></script>
</body>
</html>
